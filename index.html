<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRAVEN - App Download Center</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b10;color:#fff;font-family:Arial,sans-serif}
.header{text-align:center;padding:28px 18px 20px}
.header h1{margin:0;font-size:32px;font-weight:800}
.header p{margin:25px 0 0;color:#aeb3c0;font-size:25px}
.container{padding:25px 30px}
.card{background:linear-gradient(145deg,#11151c,#15111c);border:2px solid #252c36;border-radius:34px;padding:30px;margin-bottom:25px}
.card h2{margin:0;font-size:28px}
.card p{color:#aeb3c0;font-size:20px;margin:16px 0 25px}
.download{display:block;width:100%;padding:23px;background:#32d17d;color:#07100b;text-align:center;text-decoration:none;border-radius:22px;font-size:26px;font-weight:bold;border:0;cursor:pointer}
.download:disabled{opacity:.7}
.status{text-align:center;color:#aeb3c0;padding:30px;font-size:20px}
.footer{text-align:center;color:#777d88;font-size:18px;margin:45px 20px 30px}
</style>
</head>
<body>
<div class="header"><h1>KRAVEN</h1><p>App Download Center</p></div>
<div class="container" id="apps"><div class="status">Loading apps...</div></div>
<div class="footer">Links are controlled by your online config.</div>

<script>
const CONFIG_URL = "https://raw.githubusercontent.com/mahdihasan579a-debug/config.json/refs/heads/main/Config.json1";

async function loadApps(){
  const container=document.getElementById("apps");
  try{
    const r=await fetch(CONFIG_URL+"?v="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("Config unavailable");
    const data=await r.json();
    if(!Array.isArray(data.apps)) throw new Error("Invalid config");
    container.innerHTML="";

    data.apps.forEach(app=>{
      const card=document.createElement("div");
      card.className="card";

      const title=document.createElement("h2");
      title.textContent=app.name||"App";

      const desc=document.createElement("p");
      desc.textContent=app.description||"APK • Download";

      const btn=document.createElement("button");
      btn.className="download";
      btn.textContent="↓ DOWNLOAD";

      btn.onclick=()=>{
        if(!app.link) return;
        btn.disabled=true;
        btn.textContent="Downloading...";

        // Ask the browser to download instead of intentionally navigating
        // to the download URL.
        const a=document.createElement("a");
        a.href=app.link;
        a.download="";
        a.rel="noopener";
        document.body.appendChild(a);
        a.click();
        a.remove();

        setTimeout(()=>{
          btn.disabled=false;
          btn.textContent="↓ DOWNLOAD";
        },3000);
      };

      card.append(title,desc,btn);
      container.appendChild(card);
    });
  }catch(e){
    container.innerHTML='<div class="status">Hindi ma-load ang online config.</div>';
  }
}
loadApps();
</script>
</body>
</html>
